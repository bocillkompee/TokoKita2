<div class="max-w-6xl mx-auto px-4 pt-24">

    <h2 class="text-2xl font-semibold text-heading mb-4">
        Keranjang Belanja
    </h2>

    <p class="text-body mb-6">
        Berikut adalah daftar produk yang telah Anda tambahkan ke keranjang belanja Anda.
    </p>

    <div class="grid md:grid-cols-3 gap-6">

        <!-- Daftar Produk -->
        <div id="cart-container" class="md:col-span-2 space-y-4">
        </div>

        <!-- Ringkasan Belanja -->
        <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-5 h-fit">

            <h3 class="text-lg font-semibold mb-4">
                Ringkasan Belanja
            </h3>

            <div class="flex justify-between mb-2">
                <span>Total Item</span>
                <span id="total-items">0</span>
            </div>

            <div class="flex justify-between mb-4">
                <span>Total Harga</span>
                <span id="total-price">Rp 0</span>
            </div>

            <div class="flex items-center mb-4">
                <input
                    id="terms"
                    type="checkbox"
                    class="w-4 h-4">

                <label
                    for="terms"
                    class="ml-2 text-sm">
                    Setuju dan lanjutkan
                </label>
            </div>

            <button
                id="checkout-btn"
                class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg">
                Checkout
            </button>

        </div>

    </div>

</div>

    lucide.createIcons();
